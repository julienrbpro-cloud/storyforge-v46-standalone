name: StoryForge CI

on:
  push:
    branches:
      - ux-global-cases
  pull_request:
    branches:
      - grok-app
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storyforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and regression tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start development server
        shell: bash
        run: |
          npm run dev > "$RUNNER_TEMP/storyforge-dev.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/storyforge-dev.pid"
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/storyforge-dev.log"
          exit 1

      - name: Browser tests — development
        env:
          STORYFORGE_TEST_URL: http://127.0.0.1:8080
          STORYFORGE_TEST_OUTPUT: ${{ runner.temp }}/storyforge-dev
        run: npm run test:browser

      - name: Stop development server
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/storyforge-dev.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/storyforge-dev.pid")" 2>/dev/null || true
          fi

      - name: Start compiled preview
        shell: bash
        run: |
          npm run preview -- --host 0.0.0.0 --port 8081 > "$RUNNER_TEMP/storyforge-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/storyforge-preview.pid"
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8081/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/storyforge-preview.log"
          exit 1

      - name: Browser tests — compiled build
        env:
          STORYFORGE_TEST_URL: http://127.0.0.1:8081
          STORYFORGE_TEST_OUTPUT: ${{ runner.temp }}/storyforge-production
        run: npm run test:browser

      - name: Stop compiled preview
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/storyforge-preview.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/storyforge-preview.pid")" 2>/dev/null || true
          fi

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storyforge-qa-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/storyforge-dev/**
            ${{ runner.temp }}/storyforge-production/**
            ${{ runner.temp }}/storyforge-dev.log
            ${{ runner.temp }}/storyforge-preview.log
