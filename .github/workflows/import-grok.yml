name: Import Grok final workspace

on:
  push:
    branches:
      - ux-sequence-globale
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux-sequence-globale
          fetch-depth: 0

      - name: Apply verified Grok snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat             .grok-import/patch.part1             .grok-import/p2.1             .grok-import/p2.2             .grok-import/p2.3a             .grok-import/p2.3b             .grok-import/p2.4             .grok-import/p3.1             .grok-import/p3.2             .grok-import/p3.3             .grok-import/p3.4a             .grok-import/p3.4b             .grok-import/patch.part4 > /tmp/grok.patch.b64
          echo "b54188ad14acb5c79fba240ed8d456da72f04d68ecb67e9ef6804f9ba158bb4f  /tmp/grok.patch.b64" | sha256sum -c -
          base64 -d /tmp/grok.patch.b64 | gzip -d > /tmp/grok.patch
          git apply --index --binary /tmp/grok.patch
          git restore --source=HEAD --staged --worktree .github/workflows/storyforge-ci.yml
          git rm -r .grok-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import Grok global case sequence refactor"
          git push origin HEAD:ux-sequence-globale
