<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoryForge V4.6</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#070605}#msg{position:fixed;inset:0;display:grid;place-items:center;color:#f1e9dc;font:16px system-ui;text-align:center;padding:24px;background:#070605;z-index:-1}</style></head><body><div id="msg">Chargement de StoryForge…</div><iframe id="sf" src="./StoryForge_Nous_malgre_nous_V4.6.index.html" title="StoryForge"></iframe><script>const f=document.getElementById('sf');f.addEventListener('load',()=>{try{const s=f.contentDocument.createElement('script');s.src='./storyforge-refactor.js';s.onload=()=>{const x=f.contentDocument.createElement('script');x.src='./storyforge-export.js';f.contentDocument.body.appendChild(x)};s.onerror=()=>document.getElementById('msg').textContent='Le correctif StoryForge n’a pas pu être chargé. Ouvre index.html avec Preview dans Acode.';f.contentDocument.body.appendChild(s)}catch(e){document.getElementById('msg').textContent='Ouvre index.html avec Preview dans Acode (le mode file:// peut bloquer le chargement).'}});</script></body></html>
